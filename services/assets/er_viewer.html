<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>__CSS__</style>
</head>
<body>
<div id="bar">
  <div id="info">
    <div id="hint">Click a column, line or table header to highlight its relationships.</div>
    <div id="selected" hidden></div>
    <div id="lines" hidden></div>
  </div>
  <div id="summary"></div>
  <div class="search">
    <input id="search" type="search" placeholder="Find table ( / )" aria-label="Find table" autocomplete="off">
    <span id="search-count"></span>
  </div>
  <div class="tools">
    <button id="zoom-out" title="Zoom out">&minus;</button>
    <button id="zoom-in" title="Zoom in">+</button>
    <button id="fit" title="Fit to width">Fit</button>
    <button id="clear" title="Clear selection (Esc)">Clear</button>
  </div>
  <div class="export" id="legend">
    <button id="legend-button" aria-expanded="false" title="What the symbols mean">Legend</button>
    <div id="legend-body" class="menu" hidden></div>
  </div>
  <div class="export">
    <button id="export-button" aria-haspopup="true" aria-expanded="false" title="Download this diagram">Export &#9662;</button>
    <div id="export-menu" role="menu" hidden>
      <div class="menu-note">Saves what you see, including any highlight.</div>
      <button role="menuitem" data-export="png">PNG image</button>
      <button role="menuitem" data-export="svg">SVG vector</button>
      <button role="menuitem" data-export="mermaid">Mermaid (.mmd)</button>
      <button role="menuitem" data-export="dot">Graphviz (.dot)</button>
    </div>
  </div>
  <button id="fullscreen" class="icon-btn" title="Full screen" aria-pressed="false">&#9974;</button>
</div>
<div id="stage"><svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="minimap" hidden><svg id="mini" xmlns="http://www.w3.org/2000/svg"></svg></div>
<script type="application/json" id="er-data">__DATA__</script>
<script>__JS__</script>
</body>
</html>
