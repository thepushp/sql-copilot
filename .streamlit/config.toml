# Safe local defaults: listen on this machine only, send no usage statistics.
# To share the app, put your own authentication/proxy in front of it.
[server]
address = "127.0.0.1"

[browser]
gatherUsageStats = false

[client]
# Keep the full three-dot menu (Rerun, Clear cache, Print, ...). "minimal" and
# "viewer" remove Rerun. The Deploy button is hidden by a style rule in app.py.
toolbarMode = "developer"

# Defining both themes lets users pick Light / Dark / System in the menu
# (three dots > Settings).
[theme.light]
primaryColor = "#2563eb"

[theme.dark]
primaryColor = "#60a5fa"
