name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (pinned versions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock pytest
      - run: pytest

  latest-dependencies:
    name: Tests (latest dependencies, informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: pytest
